# Интернет-будильник: GitHub Actions пингует Render каждые 5 минут (ПК не нужен).
name: Keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/keepalive.yml"

concurrency:
  group: bananwow-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake bananwow on Render
        env:
          URL: https://bananwow.onrender.com/api/ping
        run: |
          set -e
          echo "Pinging $URL (UTC $(date -u +%H:%M:%S))"
          # cold start на free Render может занять до ~90 сек
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /tmp/ka_body.txt -w "%{http_code}" --max-time 110 \
              -H "User-Agent: bananwow-github-keepalive/2.0" \
              "$URL" || echo "000")
            echo "try $i → HTTP $code"
            head -c 300 /tmp/ka_body.txt 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then
              echo "OK — service awake"
              exit 0
            fi
            sleep 12
          done
          echo "FAILED — could not wake service"
          exit 1

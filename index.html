<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Find 3 identical fruits — Win 100 stars</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg0: #0a0a0c;
      --gold: #c9a227;
      --gold-dim: rgba(201, 162, 39, 0.45);
      --text: #f2f0ea;
      --muted: #9a968c;
      --lose: #e8e4dc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100%;
      height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: radial-gradient(ellipse 120% 80% at 50% -10%, #1c1c28 0%, var(--bg0) 55%);
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 32px;
    }

    .wrap {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    h1 {
      font-size: clamp(1.15rem, 4.6vw, 1.4rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      text-align: center;
      line-height: 1.35;
      background: linear-gradient(180deg, #fff8e7 0%, #d4b84a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 .win-line {
      display: block;
      margin-top: 0.2em;
      font-size: 0.92em;
    }

    .attempts {
      display: none;
    }

    .attempts strong {
      color: var(--gold);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }

    .board.locked {
      pointer-events: none;
      opacity: 0.45;
    }

    /*
      Flip без backface-visibility / preserve-3d —
      Telegram WebView их часто ломает (пропадает и рубашка, и фрукт).
      Две стороны поверх друг друга + scaleX / opacity.
    */
    .card {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
      margin: 0;
      border-radius: 16px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.45);
      -webkit-appearance: none;
      appearance: none;
      overflow: visible;
    }

    .card:disabled { cursor: default; }

    .card-inner {
      position: absolute;
      inset: 0;
      border-radius: 16px;
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition:
        transform 0.55s cubic-bezier(0.4, 0.1, 0.2, 1),
        opacity 0.2s linear;
    }

    .face-back {
      z-index: 2;
      opacity: 1;
      transform: scaleX(1);
      background: linear-gradient(145deg, #22222e 0%, #14141c 55%, #1a1a24 100%);
      border: 1.5px solid var(--gold-dim);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        inset 0 0 24px rgba(201, 162, 39, 0.06);
    }

    .face-front {
      z-index: 1;
      opacity: 0;
      transform: scaleX(0);
      background: linear-gradient(160deg, #2a2a36 0%, #18181f 100%);
      border: 1.5px solid rgba(201, 162, 39, 0.35);
      pointer-events: none;
    }

    /* Переворот: рубашка сжимается, затем фрукт раскрывается */
    .card.flipped .face-back {
      z-index: 1;
      opacity: 0;
      transform: scaleX(0);
      transition:
        transform 0.28s cubic-bezier(0.4, 0.1, 0.2, 1),
        opacity 0.12s linear 0.16s;
      pointer-events: none;
    }

    .card.flipped .face-front {
      z-index: 2;
      opacity: 1;
      transform: scaleX(1);
      transition:
        transform 0.32s cubic-bezier(0.34, 1.2, 0.64, 1) 0.22s,
        opacity 0.1s linear 0.22s;
      pointer-events: auto;
    }

    .card.shake .face-front {
      animation: shake 0.55s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    .card.dim .face {
      opacity: 0.35 !important;
      transition: opacity 0.5s ease;
    }

    .fruit-img,
    .back-img {
      width: 78%;
      height: 78%;
      object-fit: contain;
      display: block;
      user-select: none;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .back-img {
      width: 56%;
      height: 56%;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 5, 8, 0.72);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
      z-index: 20;
      padding: 24px;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      width: 100%;
      max-width: 320px;
      text-align: center;
      padding: 32px 24px 28px;
      border-radius: 20px;
      background: linear-gradient(165deg, #1e1e28 0%, #121218 100%);
      border: 1px solid rgba(201, 162, 39, 0.35);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.55);
      transform: translateY(12px) scale(0.96);
      transition: transform 0.45s cubic-bezier(0.34, 1.2, 0.64, 1);
    }

    .overlay.show .modal {
      transform: translateY(0) scale(1);
    }

    .modal h2 {
      font-size: 1.55rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--lose);
      margin-bottom: 10px;
    }

    .modal p {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 22px;
      line-height: 1.45;
    }

    .price-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 18px;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      color: #1a1408;
      font-weight: 700;
      background: linear-gradient(180deg, #e8d48a 0%, #c9a227 100%);
    }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #1a1408;
      background: linear-gradient(180deg, #e8d48a 0%, #c9a227 55%, #a8861a 100%);
      padding: 14px 28px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(201, 162, 39, 0.28);
      transition: transform 0.15s ease, filter 0.15s ease, opacity 0.15s ease;
      width: 100%;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
      filter: brightness(0.95);
    }

    .btn-ghost {
      margin-top: 10px;
      background: transparent;
      color: var(--muted);
      box-shadow: none;
      border: 1px solid rgba(154, 150, 140, 0.35);
      font-weight: 500;
      font-size: 0.85rem;
      padding: 10px 16px;
    }

    .err {
      color: #e07070;
      font-size: 0.82rem;
      margin-top: 12px;
      min-height: 1.2em;
    }

    .hint,
    .pay-badge {
      display: none;
    }

    @keyframes shake {
      0%, 100% { transform: scaleX(1) translateX(0); }
      15% { transform: scaleX(1) translateX(-6px); }
      30% { transform: scaleX(1) translateX(6px); }
      45% { transform: scaleX(1) translateX(-5px); }
      60% { transform: scaleX(1) translateX(4px); }
      75% { transform: scaleX(1) translateX(-2px); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Find 3 identical fruits<span class="win-line">Win 100 stars</span></h1>
    <p class="attempts">Attempts: <strong id="attempts">3</strong></p>
    <p class="pay-badge">One game — <span id="priceLabel">10 ⭐</span></p>
    <div class="board locked" id="board" aria-label="Game board"></div>
    <p class="hint">Find 3 identical fruits</p>
  </div>

  <!-- Paywall / start -->
  <div class="overlay show" id="payOverlay" role="dialog" aria-modal="true">
    <div class="modal">
      <h2 style="color: var(--lose);">Ready to play?</h2>
      <p>Open 3 identical fruits in 3 moves. Good luck!</p>
      <div class="price-tag" id="priceTag">⭐ 10 Stars</div>
      <button type="button" class="btn" id="payBtn">Play for 10 ⭐</button>
      <p class="err" id="payErr"></p>
      <button type="button" class="btn btn-ghost" id="demoBtn" hidden>Demo (browser, free)</button>
    </div>
  </div>

  <!-- Lose -->
  <div class="overlay" id="loseOverlay" role="dialog" aria-modal="true" aria-labelledby="lose-title">
    <div class="modal">
      <h2 id="lose-title">You lost</h2>
      <p>No three of a kind. Play again for 10 ⭐.</p>
      <button type="button" class="btn" id="retryPayBtn">Play again for 10 ⭐</button>
      <p class="err" id="retryErr"></p>
    </div>
  </div>

  <script>
    (function () {
      // Иконки: assets/icons/<id>.png — v= ломает кэш Telegram WebView
      const ICON_V = "20260726d";
      const ICON_BASE = "assets/icons/";
      const iconUrl = (name) => ICON_BASE + name + "?v=" + ICON_V;
      const CARD_BACK = iconUrl("card_back.png");
      const FRUITS = [
        { id: "banana", icon: iconUrl("banana.png"), label: "Banana" },
        { id: "strawberry", icon: iconUrl("strawberry.png"), label: "Strawberry" },
        { id: "cherry", icon: iconUrl("cherry.png"), label: "Cherry" },
        { id: "lemon", icon: iconUrl("lemon.png"), label: "Lemon" },
        { id: "grape", icon: iconUrl("grape.png"), label: "Grape" },
      ];

      // Preload images so flip is never empty
      [CARD_BACK].concat(FRUITS.map((f) => f.icon)).forEach((src) => {
        const im = new Image();
        im.src = src;
      });

      const MAX_ATTEMPTS = 3;
      const PRICE = 10;

      const boardEl = document.getElementById("board");
      const attemptsEl = document.getElementById("attempts");
      const payOverlay = document.getElementById("payOverlay");
      const loseOverlay = document.getElementById("loseOverlay");
      const payBtn = document.getElementById("payBtn");
      const retryPayBtn = document.getElementById("retryPayBtn");
      const payErr = document.getElementById("payErr");
      const retryErr = document.getElementById("retryErr");
      const demoBtn = document.getElementById("demoBtn");
      const priceLabel = document.getElementById("priceLabel");
      const priceTag = document.getElementById("priceTag");

      // Free-play admins (mirrored on server)
      const ADMIN_USERNAMES = ["bonamartin69"];

      let deck = [];
      let attemptsLeft = MAX_ATTEMPTS;
      let locked = true;
      let paidRound = false;
      let isAdmin = false;

      const tg = window.Telegram && window.Telegram.WebApp;

      try {
        if (tg) {
          tg.ready();
          tg.expand();
          if (tg.setHeaderColor) tg.setHeaderColor("#0a0a0c");
          if (tg.setBackgroundColor) tg.setBackgroundColor("#0a0a0c");
        }
      } catch (_) {}

      function isInsideTelegram() {
        if (!tg) return false;
        const platform = String(tg.platform || "").toLowerCase();
        if (platform && platform !== "unknown") return true;
        if (tg.initData && String(tg.initData).length > 0) return true;
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) return true;
        try {
          const q = window.location.hash || window.location.search || "";
          if (/tgWebAppData|tgWebAppVersion/i.test(q)) return true;
        } catch (_) {}
        return false;
      }

      function canOpenInvoice() {
        return !!(tg && typeof tg.openInvoice === "function");
      }

      function localUsername() {
        const u =
          (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.username) ||
          "";
        return String(u).replace(/^@/, "").toLowerCase();
      }

      function isLocalAdmin() {
        const name = localUsername();
        return !!(name && ADMIN_USERNAMES.indexOf(name) !== -1);
      }

      const inTelegram = isInsideTelegram();

      demoBtn.hidden = true;
      if (!inTelegram) {
        const platform = String((tg && tg.platform) || "unknown").toLowerCase();
        if (platform === "unknown" || /[?&#]demo=1(?:&|$)/.test(location.href)) {
          demoBtn.hidden = false;
        }
      }

      function applyAdminUi() {
        if (!isAdmin) return;
        priceLabel.textContent = "admin · free";
        priceTag.textContent = "👑 Admin";
        payBtn.textContent = "Play free";
        retryPayBtn.textContent = "Play again (free)";
        const loseP = loseOverlay.querySelector("p");
        if (loseP) loseP.textContent = "No three of a kind. You can play again right away.";
      }

      function applyPaidUi() {
        priceLabel.textContent = PRICE + " ⭐";
        priceTag.textContent = "⭐ " + PRICE + " Stars";
        payBtn.textContent = "Play for " + PRICE + " ⭐";
        retryPayBtn.textContent = "Play again for " + PRICE + " ⭐";
      }

      applyPaidUi();

      if (isLocalAdmin()) {
        isAdmin = true;
        applyAdminUi();
      }

      (async function checkAdmin() {
        try {
          const endpoint = new URL("/api/me", window.location.origin).href;
          const res = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              initData: (tg && tg.initData) || "",
              username: localUsername(),
              userId:
                (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) ||
                null,
            }),
          });
          const data = await res.json();
          if (data && data.isAdmin) {
            isAdmin = true;
            applyAdminUi();
          } else if (data && data.verified && !data.isAdmin) {
            isAdmin = false;
            applyPaidUi();
          }
        } catch (e) {
          console.warn("checkAdmin", e);
        }
      })();

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      /** 2+2+2+2+1 — на поле нет трёх одинаковых */
      function generateRiggedDeck() {
        const types = shuffle(FRUITS);
        const counts = [2, 2, 2, 2, 1];
        const result = [];
        for (let i = 0; i < types.length; i++) {
          for (let k = 0; k < counts[i]; k++) result.push(types[i]);
        }
        return shuffle(result);
      }

      function renderBoard() {
        boardEl.innerHTML = "";
        deck.forEach((fruit, index) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "card";
          btn.dataset.index = String(index);
          btn.setAttribute("aria-label", "Closed card");
          const inner = document.createElement("span");
          inner.className = "card-inner";

          const back = document.createElement("span");
          back.className = "face face-back";
          back.setAttribute("aria-hidden", "true");
          const backImg = document.createElement("img");
          backImg.className = "back-img";
          backImg.src = CARD_BACK;
          backImg.alt = "";
          backImg.draggable = false;
          back.appendChild(backImg);

          const front = document.createElement("span");
          front.className = "face face-front";
          front.setAttribute("aria-hidden", "true");
          const fruitImg = document.createElement("img");
          fruitImg.className = "fruit-img";
          fruitImg.src = fruit.icon;
          fruitImg.alt = fruit.label;
          fruitImg.draggable = false;
          front.appendChild(fruitImg);

          inner.appendChild(back);
          inner.appendChild(front);
          btn.appendChild(inner);
          btn.addEventListener("click", () => onCardClick(index, btn));
          boardEl.appendChild(btn);
        });
      }

      function prepareNewRound() {
        attemptsLeft = MAX_ATTEMPTS;
        attemptsEl.textContent = String(attemptsLeft);
        locked = false;
        paidRound = true;
        deck = generateRiggedDeck();
        renderBoard();
        boardEl.classList.remove("locked");
        payOverlay.classList.remove("show");
        loseOverlay.classList.remove("show");
      }

      function lockBoard() {
        locked = true;
        paidRound = false;
        boardEl.classList.add("locked");
      }

      function onCardClick(index, btn) {
        if (locked || !paidRound || attemptsLeft <= 0) return;
        if (btn.classList.contains("flipped")) return;

        btn.classList.add("flipped");
        btn.disabled = true;
        btn.setAttribute("aria-label", deck[index].label);
        attemptsLeft -= 1;
        attemptsEl.textContent = String(attemptsLeft);

        if (attemptsLeft === 0) {
          locked = true;
          setTimeout(finishLose, 700);
        }
      }

      function finishLose() {
        const cards = boardEl.querySelectorAll(".card");
        cards.forEach((c) => {
          if (c.classList.contains("flipped")) c.classList.add("shake");
        });
        setTimeout(() => {
          cards.forEach((c) => {
            c.classList.remove("shake");
            c.classList.add("dim");
            if (!c.classList.contains("flipped")) {
              c.classList.add("flipped");
              c.disabled = true;
              const i = Number(c.dataset.index);
              c.setAttribute("aria-label", deck[i].label);
            }
          });
          paidRound = false;
          setTimeout(() => loseOverlay.classList.add("show"), 280);
        }, 580);
      }

      async function createInvoiceLink() {
        const userId =
          (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) ||
          "0";
        const endpoint = new URL("/api/create-invoice", window.location.origin).href;
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            userId: String(userId),
            initData: (tg && tg.initData) || "",
          }),
        });
        let data = {};
        try {
          data = await res.json();
        } catch (_) {
          throw new Error("Server did not respond (code " + res.status + ")");
        }
        if (!res.ok || !data.ok) {
          const msg = data.error || "Could not create invoice";
          throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
        }
        if (data.free) {
          return { free: true };
        }
        if (!data.invoiceLink) {
          throw new Error("Could not create invoice");
        }
        return { free: false, invoiceLink: data.invoiceLink };
      }

      function openStarsPayment(errEl, btn) {
        return new Promise(async (resolve) => {
          errEl.textContent = "";
          btn.disabled = true;

          if (isAdmin || isLocalAdmin()) {
            isAdmin = true;
            applyAdminUi();
            btn.disabled = false;
            resolve(true);
            return;
          }

          if (!canOpenInvoice()) {
            errEl.textContent = "Open the game via the Telegram bot (Play button).";
            btn.disabled = false;
            resolve(false);
            return;
          }

          try {
            const result = await createInvoiceLink();
            if (result.free) {
              isAdmin = true;
              applyAdminUi();
              btn.disabled = false;
              resolve(true);
              return;
            }
            tg.openInvoice(result.invoiceLink, (status) => {
              btn.disabled = false;
              if (status === "paid") {
                resolve(true);
              } else if (status === "cancelled") {
                errEl.textContent = "Payment cancelled.";
                resolve(false);
              } else if (status === "failed") {
                errEl.textContent = "Payment failed. Please try again.";
                resolve(false);
              } else if (status === "pending") {
                errEl.textContent = "Payment pending…";
                resolve(false);
              } else {
                errEl.textContent = "Payment status: " + status;
                resolve(false);
              }
            });
          } catch (e) {
            console.error(e);
            let msg = e.message || "Payment error";
            if (msg.length > 180) msg = msg.slice(0, 180) + "…";
            errEl.textContent = msg;
            btn.disabled = false;
            resolve(false);
          }
        });
      }

      payBtn.addEventListener("click", async () => {
        const ok = await openStarsPayment(payErr, payBtn);
        if (ok) prepareNewRound();
      });

      retryPayBtn.addEventListener("click", async () => {
        const ok = await openStarsPayment(retryErr, retryPayBtn);
        if (ok) prepareNewRound();
      });

      demoBtn.addEventListener("click", () => {
        prepareNewRound();
      });

      // Start locked under paywall
      lockBoard();
      deck = generateRiggedDeck();
      renderBoard();
      boardEl.classList.add("locked");
    })();
  </script>
</body>
</html>

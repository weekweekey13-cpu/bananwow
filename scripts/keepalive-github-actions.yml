# Справка / копия. Рабочий файл: .github/workflows/keepalive.yml
name: Keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake bananwow on Render
        run: |
          set -e
          URL="https://bananwow.onrender.com/api/ping"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /tmp/ka_body.txt -w "%{http_code}" --max-time 110 "$URL" || echo "000")
            echo "try $i → HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 12
          done
          exit 1
